name: Proxy Harvester

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build scraper
        run: |
          cd proxy-scraper
          go build -o scraper scraper.go

      - name: Run harvester
        run: |
          cd proxy-scraper
          ./scraper -c 8000 -t 5

      - name: Show stats
        run: |
          echo "=== SOCKS5 ==="
          wc -l proxy-scraper/socks5.txt
          echo "=== HTTP ==="
          wc -l proxy-scraper/http.txt
          echo "=== COMBINED ==="
          wc -l proxy-scraper/proxies.txt

      - name: Commit proxies
        run: |
          git config user.name "Proxy Bot"
          git config user.email "bot@proxy.local"
          cd proxy-scraper
          git add proxies.txt socks5.txt http.txt
          git diff --cached --quiet || git commit -m "Update proxies $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxies-${{ github.run_number }}
          path: |
            proxy-scraper/proxies.txt
            proxy-scraper/socks5.txt
            proxy-scraper/http.txt
          retention-days: 7
